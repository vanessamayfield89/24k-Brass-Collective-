<script>
  // Darken effect: on desktop (a real mouse), rely purely on the CSS
  // :hover rule below — don't fight it with scroll-based toggling.
  // On touch devices, darken whichever card is nearest the centre of
  // the screen, within a narrow band so more of the photo stays visible.
  const cards = document.querySelectorAll('.offer-card');
  const supportsHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (cards.length && !supportsHover) {
    let ticking = false;
    function updateCenterCard() {
      const viewportCenter = window.innerHeight / 2;
      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.top + rect.height / 2;
        const distance = Math.abs(cardCenter - viewportCenter);
        card.classList.toggle('in-view', distance < rect.height * 0.18);
      });
      ticking = false;
    }
    function onScroll() {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(updateCenterCard);
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    updateCenterCard();
  }

  document.querySelectorAll('.nav-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const nav = btn.closest('.main-nav');
      nav.classList.toggle('open');
    });
  });
  document.addEventListener('click', (e) => {
    document.querySelectorAll('.main-nav.open').forEach(nav => {
      if (!nav.contains(e.target)) nav.classList.remove('open');
    });
  });
</script>

</body>
