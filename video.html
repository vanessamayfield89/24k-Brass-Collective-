<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos — 24K DJ Live</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body style="background-color:#0d0c0a; margin:0;">

<header class="site-header" style="background-color:#0d0c0a;">
  <a class="brand" href="index.html">
    <img src="../images/logo.png" alt="24K Brass Collective logo">
  </a>
  <nav class="main-nav">
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span class="bars">☰</span></button>
    <ul>
      <li><a href="../index.html">24K</a></li>
      <li><a href="../band/index.html">24K Brass Collective</a></li>
      <li><a href="index.html">Home</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="video.html" class="active">Videos</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>
<div class="gold-bar"></div>

<section class="hero-page" style="background-image: linear-gradient(to bottom, rgba(6,5,4,.05) 0%, rgba(6,5,4,.2) 45%, rgba(6,5,4,.82) 78%, rgba(6,5,4,.96) 100%), url('../images/hero-dj.jpg');">
  <h1>See DJ Live in action</h1>
</section>

<section>

  <div class="video-item">
    <h3>DJ Live</h3>
    <div class="video-embed">
      <iframe src="https://www.youtube.com/embed/H--lTV_y2_g" allow="autoplay; encrypted-media" allowfullscreen title="24K DJ Live"></iframe>
    </div>
  </div>

  <div class="video-item">
    <h3>DJ Live Heavy</h3>
    <div class="video-embed">
      <iframe src="https://www.youtube.com/embed/vpVxa757iM0" allow="autoplay; encrypted-media" allowfullscreen title="24K DJ Live Heavy"></iframe>
    </div>
  </div>

</section>

<footer>
  <span class="footer-brand">24K DJ Live</span>
  <span>&copy; 2026 24K Brass Collective. All rights reserved.</span>
</footer>

<script>
  document.querySelectorAll('.nav-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const nav = btn.closest('.main-nav');
      nav.classList.toggle('open');
    });
  });
  document.addEventListener('click', (e) => {
    document.querySelectorAll('.main-nav.open').forEach(nav => {
      if (!nav.contains(e.target)) nav.classList.remove('open');
    });
  });
</script>

</body>
</html>
