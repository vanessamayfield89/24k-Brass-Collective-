<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — 24K DJ Live</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body style="background-color:#0d0c0a; margin:0;">

<header class="site-header" style="background-color:#0d0c0a;">
  <a class="brand" href="index.html">
    <img src="../images/logo.png" alt="24K Brass Collective logo">
  </a>
  <nav class="main-nav">
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span class="bars">☰</span></button>
    <ul>
      <li><a href="../index.html">24K</a></li>
      <li><a href="../band/index.html">24K Brass Collective</a></li>
      <li><a href="index.html">Home</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="video.html">Videos</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
</header>
<div class="gold-bar"></div>

<section class="hero-page" style="background-image: linear-gradient(to bottom, rgba(6,5,4,.05) 0%, rgba(6,5,4,.2) 45%, rgba(6,5,4,.82) 78%, rgba(6,5,4,.96) 100%), url('../images/hero-dj.jpg');">
  <h1>Book 24K DJ Live</h1>
</section>

<section>
  <div class="contact-grid">
    <div>
      <span class="eyebrow-line">Send an enquiry</span>
      <h2 class="section-title">Tell us about your event</h2>
      <img class="section-photo" id="contact-photo" src="../images/section-contact-dj.jpg" alt="24K DJ Live performing" style="margin-top:1.6rem;">
    </div>

    <div class="contact-panel">
      <form class="contact-form" id="dj-contact-form" action="https://formspree.io/f/xljdwabb" method="POST">
        <input type="hidden" name="_subject" value="24K DJ Live enquiry">
        <div>
          <label for="dj-name">Name</label>
          <input type="text" id="dj-name" name="name" required>
        </div>
        <div>
          <label for="dj-email">Email</label>
          <input type="email" id="dj-email" name="email" required>
        </div>
        <div>
          <label for="dj-date">Event date</label>
          <input type="text" id="dj-date" name="event_date" placeholder="e.g. 14 June 2027">
        </div>
        <div>
          <label for="dj-message">Message</label>
          <textarea id="dj-message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn filled">Send Enquiry</button>
        <p class="form-status" id="dj-form-status"></p>
      </form>
      <p class="contact-form-note">Or you can email us directly at <a href="mailto:info@24kbrass.com">info@24kbrass.com</a></p>
    </div>
  </div>
</section>

<footer>
  <span class="footer-brand">24K DJ Live</span>
  <span>&copy; 2026 24K Brass Collective. All rights reserved.</span>
</footer>

<script>
  document.querySelectorAll('.nav-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const nav = btn.closest('.main-nav');
      nav.classList.toggle('open');
    });
  });
  document.addEventListener('click', (e) => {
    document.querySelectorAll('.main-nav.open').forEach(nav => {
      if (!nav.contains(e.target)) nav.classList.remove('open');
    });
  });

  // Match the contact photo's height to the form panel's rendered height,
  // so it never runs past it — only on wide screens where they sit side by side.
  function matchContactPhotoHeight() {
    const photo = document.getElementById('contact-photo');
    const panel = document.querySelector('.contact-panel');
    if (!photo || !panel) return;
    if (window.innerWidth > 800) {
      photo.style.height = panel.offsetHeight + 'px';
    } else {
      photo.style.height = '';
    }
  }
  window.addEventListener('load', matchContactPhotoHeight);
  window.addEventListener('resize', matchContactPhotoHeight);

  // Submit straight to Formspree via fetch, no mail app needed.
  const djForm = document.getElementById('dj-contact-form');
  const djStatus = document.getElementById('dj-form-status');
  djForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const dateVal = document.getElementById('dj-date').value;
    djForm.querySelector('input[name="_subject"]').value = dateVal
      ? `24K DJ Live enquiry \u2014 ${dateVal}`
      : '24K DJ Live enquiry';
    const submitBtn = djForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    djStatus.classList.remove('show', 'error');
    fetch(djForm.action, {
      method: 'POST',
      body: new FormData(djForm),
      headers: { Accept: 'application/json' }
    }).then((response) => {
      submitBtn.disabled = false;
      if (response.ok) {
        djForm.reset();
        djStatus.textContent = "Thanks — we've got your enquiry and will be in touch soon.";
        djStatus.classList.add('show');
      } else {
        djStatus.textContent = 'Something went wrong sending that — please try again, or email us directly below.';
        djStatus.classList.add('show', 'error');
      }
    }).catch(() => {
      submitBtn.disabled = false;
      djStatus.textContent = 'Something went wrong sending that — please try again, or email us directly below.';
      djStatus.classList.add('show', 'error');
    });
  });
</script>

</body>
</html>
